name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # `swift test` cannot work here: the toolchain ships neither XCTest nor
      # swift-testing, so the checks are a plain executable target.
      - name: Unit checks
        run: swift run SpotifyMenuBarCoreTests

      # Catches packaging breakage (bundle assembly, ad-hoc signing) without
      # needing a signing identity. Cannot catch the no-eviction guarantee --
      # verify-no-eviction.sh needs a real menu bar on a real display and stays
      # a manual pre-PR gate.
      - name: Package app bundle
        run: ./build-app.sh
