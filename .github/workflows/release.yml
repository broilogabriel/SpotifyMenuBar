name: Release

# release-please keeps a rolling Release PR open, deriving the next version from
# Conventional Commit subjects on main. Merging that PR tags the release; the steps
# below then publish the asset and bump the tap.
#
# Those steps live in THIS workflow rather than a separate tag-triggered one because
# release-please tags using the default GITHUB_TOKEN, and pushes made with that token
# do not trigger other workflow runs. A `push: tags` workflow would never fire.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the push that merged a Release PR.
      # The `== 'true'` is deliberate: the output is the *string* "false" when no
      # release happened, and a bare non-empty string is not reliably falsy here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          # Build from the commit that was actually tagged, not whatever main has
          # drifted to since.
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Check Info.plist matches the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [ "${VERSION}" != "${PLIST_VERSION}" ]; then
            echo "::error::released ${VERSION} but Info.plist says ${PLIST_VERSION} -- the x-release-please-version annotation is probably not matching"
            exit 1
          fi

      - name: Build
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: swift build -c release

      - name: Unit checks
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: swift run SpotifyMenuBarCoreTests

      # Our own tarball, not GitHub's /archive/refs/tags/ one. GitHub does not
      # guarantee auto-generated archives are byte-stable -- a git upgrade has
      # silently changed them before and broken pinned checksums everywhere. An
      # uploaded release asset is immutable, so the formula's sha256 stays valid.
      - name: Build source tarball
        id: tarball
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          NAME="SpotifyMenuBar-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="SpotifyMenuBar-${VERSION}/" -o "${NAME}" HEAD
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "${NAME}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # upload, not create: release-please already made the release.
      - name: Attach the tarball to the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "${{ steps.tarball.outputs.name }}" --clobber

      - name: Bump formula in homebrew-tap
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.tarball.outputs.name }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"

          git clone git@github.com:broilogabriel/homebrew-tap.git tap
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          FORMULA=Formula/spotifymenubar.rb

          # Retry with a rebase: the tap is shared, so another project's release
          # can land between our clone and our push. Rebasing is safe because the
          # edit only ever touches two lines of one formula -- a concurrent
          # release touches a different file.
          for attempt in 1 2 3; do
            sed -i '' -E "s|^  url \".*\"$|  url \"${URL}\"|"          "${FORMULA}"
            sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" "${FORMULA}"
            grep -E '^  (url|sha256) ' "${FORMULA}"

            if git diff --quiet; then
              echo "formula already at ${VERSION} with this checksum -- nothing to push"
              exit 0
            fi

            git commit -am "chore: spotifymenubar ${VERSION}"
            if git push; then
              exit 0
            fi

            echo "push rejected (attempt ${attempt}) -- rebasing onto the tap's new head"
            git reset --hard HEAD~1
            git pull --rebase
          done

          echo "::error::could not push the formula bump after 3 attempts"
          exit 1
